<!DOCTYPE html>
<html>
  <head>
    <title>12l</title>
  </head>
  <body>
    <script>
      const countPositive = arr => {
        let result = 0;
        arr.forEach(element => {
          if (element > 0) result++;
        });
        return result;
      }

      console.log(countPositive([1, -3, 5]));
      console.log(countPositive([-2, 3, -5, 7, 10]));
    </script>
  </body>
</html>
