<!DOCTYPE html>
<html lang="en">
<head>
  <title>6k</title>
</head>
<body>

  <button onclick="
    console.log(`Cart quantity: ${cartQuantity}`);
    helper();
  ">Show Quantity</button>

  <button onclick="
    updateCartQuantityAdd(1);
  ">Add to Cart</button>

  <button onclick="
    updateCartQuantityAdd(2);
  ">+2</button>

  <button onclick="
    updateCartQuantityAdd(3);
  ">+3</button>

  <button onclick="
    updateCartQuantityAdd(4);
  ">+4</button>

  <button onclick="
    updateCartQuantityAdd(5);
  ">+5</button>

  <button onclick="
    updateCartQuantitySub(1);
  ">Remove from cart</button>

  <button onclick="
    updateCartQuantitySub(2);
  ">-2</button>

  <button onclick="
    updateCartQuantitySub(3);
  ">-3</button>

  <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset.');
    console.log(`Cart quantity: ${cartQuantity}`);
    helper();
  ">Reset Cart</button>

  <p class="js-result"></p>
  <script>
    let cartQuantity = 0;
    helper();

    function updateCartQuantityAdd(quantity) {
      if (cartQuantity + quantity > 10) {
        alert('The cart is full');
        return;
      }
      cartQuantity += quantity;
      console.log(`Cart quantity: ${cartQuantity}`);
      helper();
    }

    function updateCartQuantitySub(quantity) {
      if (cartQuantity - quantity < 0) {
        alert('Not enough items in the cart');
        return;
      }
      cartQuantity -= quantity;
      console.log(`Cart quantity: ${cartQuantity}`);
      helper();
    }

    function helper() {
      const result = document.querySelector('.js-result');
      result.innerHTML = `Cart quantity: ${cartQuantity}`;
    }
  </script>
</body>
</html>
