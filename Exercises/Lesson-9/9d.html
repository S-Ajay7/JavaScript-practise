<!DOCTYPE html>
<html>
  <head>
    <title>9d</title>
  </head>
  <body>
    <input class="js-input-text" placeholder="Enter your name" onkeydown="
      keyOperation(event);
    ">
    <button onclick="
      helper();
    ">submit</button>
    <p class="js-result"></p>

    <script>
      function keyOperation(event) {
        if (event.key === 'Enter') {
          helper();
        }
      }

      function helper() {
        const inputText = document.querySelector('.js-input-text');
        const name = inputText.value;

        const result = document.querySelector('.js-result');
        result.innerHTML = `Your name is: ${name}`;
      }
    </script>
  </body>
</html>
