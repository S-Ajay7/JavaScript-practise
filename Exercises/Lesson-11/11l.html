<!DOCTYPE html>
<html lang="en">
  <head>
    <title>11l</title>
  </head>
  <body>
    <script>
      function minMax(nums) {
        if (nums.length == 0) {
          return {
            min: null,
            max: null
          };
        }
        let min = nums[0];
        let max = nums[0];
        for (let i = 1; i < nums.length; i++) {
          const num = nums[i];
          if (num > max) {
            max = num;
          }
          if (num < min) {
            min = num;
          }
        }

        return {
          min,
          max
        };
      }

      console.log(minMax([1, -3, 5]));
      console.log(minMax([-2, 3, -5, 7, 10]));
      console.log(minMax([]));
      console.log(minMax([3]));
    </script>
  </body>
</html>
