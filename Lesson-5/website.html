<!DOCTYPE html>
<html>
  <head>
    <title>
      Variables
    </title>
  </head>
  <body>
    <script>
      let variable1 = 3;
      console.log(variable1);

      let calculation = 2 * 100;
      console.log(calculation);

      let result = calculation + 2;
      console.log(result);

      let message = 'Hello';
      console.log(message);

      console.log(';');

      variable1 = 5;
      console.log(variable1);

      const PI = 3.14;
      console.log(PI);

      var variable2 = 2;
      console.log(variable2);

      console.log(typeof message);

    </script>
  </body>
</html>
